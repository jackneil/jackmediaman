[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jackmediaman"
version = "0.3.0"
description = "Media library manager - organize, rename, and deduplicate your media collection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jack" }
]
keywords = ["media", "organizer", "rename", "tv", "movies", "plex", "filebot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "deluge-client>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# Archive extraction (optional - falls back to system unrar/7z commands)
archives = [
    "rarfile>=4.0",
    "py7zr>=0.20.0",
]
# Web UI (optional - for jmm --web command)
web = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]

[project.scripts]
jackmediaman = "jackmediaman.cli.app:app"
jmm = "jackmediaman.cli.app:app"

[project.urls]
Homepage = "https://github.com/jackneil/jackmediaman"
Documentation = "https://github.com/jackneil/jackmediaman#readme"
Repository = "https://github.com/jackneil/jackmediaman"

[tool.hatch.build.targets.wheel]
packages = ["src/jackmediaman"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--doctest-modules",
    "-v",
]
tmp_path_retention_policy = "none"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_network: marks tests that require network access",
]
